<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Klättra undan havet – Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#eaf4fb;--fg:#0b2a3c;--card:#fff;--line:#b9d4e6;--accent:#0a7ea4;--sea:#1b8fc4;--ok:#1a9b5a;--step:#c9b79c;--stepTop:#a8946f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a24;--fg:#e6f2f9;--card:#13293a;--line:#24435a;--accent:#4cc3ee;--sea:#1673a0;--ok:#3ccf8a;--step:#5a5142;--stepTop:#7a6e58}}
:root[data-theme="dark"]{--bg:#0b1a24;--fg:#e6f2f9;--card:#13293a;--line:#24435a;--accent:#4cc3ee;--sea:#1673a0;--ok:#3ccf8a;--step:#5a5142;--stepTop:#7a6e58}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:4px 0 2px}
.sub{margin:0 0 12px;opacity:.75}
.scene{position:relative;height:210px;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:linear-gradient(var(--bg),var(--card))}
.stairs{position:absolute;inset:0;display:flex;align-items:flex-end}
.col{flex:1;position:relative;height:100%}
.step{position:absolute;bottom:0;left:0;right:0;background:var(--step);border-top:5px solid var(--stepTop);border-right:1px solid var(--line)}
.player{position:absolute;font-size:2rem;line-height:1;transition:left .6s ease,bottom .6s ease;z-index:3;transform:translateX(-50%)}
.sea{position:absolute;left:0;right:0;bottom:0;background:var(--sea);opacity:.78;z-index:4;transition:height .8s ease;pointer-events:none}
.sea::before{content:"";position:absolute;top:-8px;left:0;right:0;height:10px;background:repeating-radial-gradient(circle at 10px 10px,transparent 0 6px,var(--sea) 7px 10px);opacity:.9}
.bar{display:flex;justify-content:space-between;margin:10px 2px;font-weight:600}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px}
.q{font-size:1.2rem;font-weight:700;margin:0 0 12px}
.opts{display:grid;gap:10px}
button{font:inherit;cursor:pointer}
.opt{text-align:left;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.fact{margin-top:12px;min-height:1.4em;opacity:.85}
.btn{padding:12px 22px;border-radius:10px;border:0;background:var(--accent);color:#04202c;font-weight:700;font-size:1rem}
.overlay{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.overlay.show{display:flex}
#over{background:#8c0000;color:#fff;animation:flash .6s 3}
#over h2{font-size:clamp(3.2rem,16vw,9rem);margin:0;letter-spacing:.05em;line-height:1;text-shadow:0 6px 0 #3d0000}
#over p{font-size:1.2rem;max-width:520px}
#win{background:#0a5c3a;color:#fff}
#win h2{font-size:clamp(2.2rem,10vw,5rem);margin:0}
.overlay .btn{background:#fff;color:#000;margin-top:14px}
@keyframes flash{50%{background:#e00000}}
</style>
</head>
<body>
<main>
  <h1>🌊 Klättra undan havet</h1>
  <p class="sub">Svara rätt på frågor om stigande havsnivåer och ta ett steg uppåt. Ett fel svar = GAME OVER.</p>
  <div class="scene" id="scene"><div class="stairs" id="stairs"></div><div class="player" id="player">🧗</div><div class="sea" id="sea"></div></div>
  <div class="bar"><span id="prog"></span><span id="stepTxt"></span></div>
  <div class="card">
    <p class="q" id="q"></p>
    <div class="opts" id="opts"></div>
    <div class="fact" id="fact"></div>
  </div>
</main>

<div class="overlay" id="over">
  <h2>GAME OVER</h2>
  <p id="overMsg"></p>
  <p id="overScore"></p>
  <button class="btn" id="retry">Försök igen</button>
</div>
<div class="overlay" id="win">
  <h2>🎉 Du klarade dig!</h2>
  <p>Du nådde toppen innan vattnet hann ikapp. Alla 10 rätt!</p>
  <button class="btn" id="again">Spela igen</button>
</div>

<script>
const Q=[
{q:"Vad är de två huvudorsakerna till att havsnivån stiger globalt?",a:["Smältande landis och att varmare vatten utvidgar sig","Fler regn och starkare vindar","Att havsbottnen sjunker överallt","Att floder blir bredare"],f:"Termisk expansion och smältande glaciärer/iskappor står för nästan hela ökningen."},
{q:"Ungefär hur mycket har den globala havsnivån stigit sedan år 1900?",a:["Cirka 20 cm","Cirka 2 cm","Cirka 2 meter","Cirka 5 meter"],f:"Det rör sig om omkring 20–25 cm."},
{q:"Vilken is bidrar till höjd havsnivå när den smälter?",a:["Landis, t.ex. Grönlands inlandsis","Havsis som flyter på havet","Båda lika mycket","Ingen av dem"],f:"Flytande havsis höjer knappt nivån (Arkimedes princip), men landis gör det."},
{q:"Hur mycket skulle havet stiga om hela Grönlands inlandsis smälte?",a:["Cirka 7 meter","Cirka 70 cm","Cirka 70 meter","Cirka 20 cm"],f:"Grönlands is motsvarar ungefär 7 meters havsnivåhöjning."},
{q:"Hur snabbt stiger havsnivån globalt just nu, i genomsnitt per år?",a:["Cirka 4 millimeter","Cirka 0,4 millimeter","Cirka 4 centimeter","Cirka 40 centimeter"],f:"Takten har ökat och ligger på runt 4 mm/år de senaste åren."},
{q:"Varför sjunker havsnivån relativt land i norra Sverige trots global höjning?",a:["Landhöjning efter istiden","Mindre nederbörd","Saltare vatten","Starkare tidvatten"],f:"Landet höjer sig upp till ca 1 cm/år i Bottenviken eftersom inlandsisens tyngd försvunnit."},
{q:"Vilken önation i Stilla havet är särskilt hotad av stigande hav?",a:["Tuvalu","Island","Madagaskar","Sri Lanka"],f:"Tuvalu ligger bara några meter över havet."},
{q:"Vad menas med termisk expansion?",a:["Varmare vatten tar större plats","Is som växer i kyla","Havsströmmar som växlar riktning","Vatten som avdunstar snabbare"],f:"När havet värms upp utvidgas vattnet och nivån stiger."},
{q:"Vilken stad sjunker snabbt och hotas dessutom av havet så att Indonesien flyttar sin huvudstad?",a:["Jakarta","Bangkok","Manila","Kuala Lumpur"],f:"Jakarta sjunker på grund av grundvattenuttag, och havet gör läget värre."},
{q:"Vilken typ av översvämning blir vanligare när havsnivån stiger?",a:["Stormflöden och högvatten vid kusten","Bara snösmältning i fjällen","Skyfall i öknar","Vulkanutbrott"],f:"Högre grundnivå gör att stormar når längre in och ger oftare översvämningar."}
];
const N=Q.length;
const $=id=>document.getElementById(id);
let order,i,locked;
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a}
function build(){
  const st=$("stairs");st.innerHTML="";
  for(let k=0;k<=N;k++){const c=document.createElement("div");c.className="col";const s=document.createElement("div");s.className="step";s.style.height=(14+k*(70/N)+ (k*0))+"%";c.appendChild(s);st.appendChild(c)}
}
function place(){
  const colW=100/(N+1);
  const stepH=14+i*(70/N);
  const p=$("player");
  p.style.left=(colW*(i+.5))+"%";
  p.style.bottom="calc("+stepH+"% + 4px)";
  $("sea").style.height=(6+i*1.6)+"%";
  $("prog").textContent="Fråga "+Math.min(i+1,N)+" av "+N;
  $("stepTxt").textContent="Steg: "+i+" / "+N;
}
function show(){
  locked=false;$("fact").textContent="";
  const it=Q[order[i]];
  $("q").textContent=it.q;
  const o=$("opts");o.innerHTML="";
  shuffle(it.a.map((t,idx)=>({t,ok:idx===0}))).forEach(x=>{
    const b=document.createElement("button");b.className="opt";b.textContent=x.t;
    b.onclick=()=>answer(b,x.ok,it);o.appendChild(b);
  });
}
function answer(b,ok,it){
  if(locked)return;locked=true;
  document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
  if(ok){
    b.classList.add("right");$("fact").textContent="✅ Rätt! "+it.f;
    i++;place();
    setTimeout(()=>{ if(i>=N){$("win").classList.add("show")} else show() },1700);
  }else{
    $("fact").textContent="";
    $("sea").style.height="100%";
    $("overMsg").textContent="Rätt svar: "+it.a[0]+". "+it.f;
    $("overScore").textContent="Du hann "+i+" steg upp av "+N+".";
    setTimeout(()=>$("over").classList.add("show"),700);
  }
}
function start(){
  $("over").classList.remove("show");$("win").classList.remove("show");
  order=shuffle(Q.map((_,k)=>k));i=0;build();place();show();
}
$("retry").onclick=start;$("again").onclick=start;
start();
</script>
</body>
</html>
